name: GeoCoinMinecraft
version: 1.2.0
main: org.noemacrypt.geocoinminecraft.GeoCoinMinecraftPlugin
api-version: '26.3'
description: Operator-controlled GeoCoin CPU and GPU miner for Paper (OpenCL in-process).
commands:
  geocoin:
    description: Configure, start, stop, or inspect GeoCoin CPU and GPU mining.
    usage: /geocoin <start|stop|status|gpu>
    permission: geocoin.admin
permissions:
  geocoin.admin:
    description: Manage GeoCoin CPU mining.
    default: op
