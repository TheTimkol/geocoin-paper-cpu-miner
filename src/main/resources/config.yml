# Mining does not start automatically. Use /geocoin start as an operator.
node:
  # Remote RPC requires HTTPS. Plain HTTP is accepted only for localhost.
  url: "https://your-node.example:3033/"
  username: "minecraft-miner"
  # File's first line is the miner-role RPC password; never use the admin password.
  password-file: "rpc-miner.pass"
mining:
  address: ""
  # Mining runs in Java worker threads inside the Paper process.
  threads: 1
limits:
  # Average CPU duty cycle across each configured mining worker, from 0 to 100.
  cpu-percent: 100
  # OpenCL GPU duty cycle. CUDA/HIP child miners cannot be throttled by this plugin.
  gpu-percent: 100
gpu:
  # Used only by cuda and amd (HIP). OpenCL runs inside the Paper JVM.
  executable: "geocoin-gpu-miner.exe"
  # Select from chat: opencl (in-process), cuda, or amd (HIP via native miner).
  backend: "opencl"
  # Device id from /geocoin gpu devices. -1 means none selected.
  device: -1
  enabled: false
logging:
  # Template refresh occurs every 10 seconds; disable routine refresh lines by default.
  # Startup, stop, errors, and accepted blocks are always logged.
  template-refresh: false
